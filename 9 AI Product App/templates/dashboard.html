<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script defer src="{{ url_for('static', filename='js/script.js') }}"></script>

</head>

<body>

<div class="container">

<div class="sidebar">
    <h2>📊 StudyAI</h2>
    <button>Dashboard</button>
</div>

<div class="main">

<h1>🚀 Student Performance</h1>

<div class="grid">

<div class="card">
    <h3>Performance Metrics</h3>

    <input id="hours" placeholder="Study Hours">
    <input id="attendance" placeholder="Attendance %">
    <input id="sleep" placeholder="Sleep Hours">
    <input id="assignments" placeholder="Assignments">
    <input id="previous" placeholder="Previous Score">

    <button onclick="predict()">Predict</button>
</div>

<div class="card">
    <h3>Status</h3>
    <h1 id="status">---</h1>

    <h2 id="score">0</h2>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <p id="risk"></p>
    <p id="grade"></p>
</div>

</div>

<canvas id="chart"></canvas>

</div>
</div>

</body>
</html>
