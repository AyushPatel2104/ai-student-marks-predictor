<!DOCTYPE html>
<html>
<head>
    <title>AI Student Performance Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container" id="card">
    <h1>🎓 AI Performance Predictor</h1>

    <form id="predictionForm">
        <input type="number" id="age" placeholder="Age (15-25)" required>
        <input type="number" id="study_hours" placeholder="Study Hours (0-12)" required>
        <input type="number" id="sleep_hours" placeholder="Sleep Hours (4-10)" required>
        <input type="number" id="attendance" placeholder="Attendance % (0-100)" required>
        <input type="number" id="assignments" placeholder="Assignments (0-10)" required>
        <input type="number" id="previous_score" placeholder="Previous Score (0-100)" required>

        <button type="submit">🚀 Predict</button>
    </form>

    <div id="loader" style="display:none;">⏳ Predicting...</div>

    <div id="result"></div>
</div>

<script>
document.getElementById("predictionForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        age: document.getElementById("age").value,
        study_hours: document.getElementById("study_hours").value,
        sleep_hours: document.getElementById("sleep_hours").value,
        attendance: document.getElementById("attendance").value,
        assignments: document.getElementById("assignments").value,
        previous_score: document.getElementById("previous_score").value
    };

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    document.getElementById("result").innerHTML =
        `<h3>Performance: ${result.performance}</h3>
         <h4>Risk Level: ${result.risk_level}</h4>`;
});
</script>

<!-- JS FILE LINK (IMPORTANT) -->
<script src="/static/script.js"></script>


</body>
</html>
